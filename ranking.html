<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Three Crossings — Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d9bc7a;--gold2:#8f713d;--ink:#090b0b;--panel:#101413;
  --line:#655538;--text:#e6e0d0;--muted:#9ba29a;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(ellipse at 50% 10%,rgba(70,91,65,.24),transparent 48%),
    radial-gradient(ellipse at 10% 90%,rgba(23,55,49,.18),transparent 42%),
    linear-gradient(180deg,#0b100e 0%,#070909 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.36;
  background:
    radial-gradient(ellipse at 8% 25%,transparent 0 18%,rgba(0,0,0,.32) 60%),
    repeating-linear-gradient(115deg,transparent 0 90px,rgba(170,190,150,.018) 91px 92px);
}
#app{position:relative;min-height:100vh;max-width:1100px;margin:auto;background:linear-gradient(180deg,rgba(10,14,12,.72),rgba(7,9,9,.88));border-left:1px solid #65553830;border-right:1px solid #65553830}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 26px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#171b19eF,#0c100feF)}
.brand{font:600 19px Cinzel,serif;letter-spacing:2px;color:var(--gold)}
.brand small{display:block;font:10px Inter,sans-serif;letter-spacing:2.2px;color:#969d91;margin-top:4px}
.back{display:inline-block;padding:10px 13px;border:1px solid #8c744c;background:#171d19;color:#e8d29a;text-decoration:none;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
main{padding:clamp(20px,5vw,48px)}
.important-note{margin:0 auto 28px;padding:18px 16px;text-align:center;border:2px solid var(--gold);background:linear-gradient(90deg,#2a2114,#171d19,#2a2114);color:#ffe5a3;font-size:clamp(20px,4vw,30px);font-weight:800;line-height:1.3;letter-spacing:1px;text-transform:uppercase;box-shadow:0 0 22px #d9bc7a22}
.eyebrow{text-align:center;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#9ba795}
h1{text-align:center;font:600 clamp(28px,5vw,42px)/1.2 Cinzel,serif;color:#e8d29a;margin:12px 0 10px}
.subtitle{text-align:center;color:#aeb8aa;font-size:13px;line-height:1.7;margin:0 auto 28px;max-width:560px}
.board{border:1px solid #a88c53;background:#101512eF;box-shadow:0 24px 80px #0008;padding:clamp(15px,3vw,28px)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.tab{padding:14px 12px;border:1px solid #4a5448;background:#171d19;color:#b9c0b4;font:600 13px Cinzel,serif;letter-spacing:1px;cursor:pointer;transition:.2s}
.tab:hover{border-color:#b99b5b}
.tab[aria-selected="true"]{background:linear-gradient(#80663a,#4d3d24);border-color:#d9bc7a;color:#fff0c6;box-shadow:inset 0 0 0 1px #e7cc8c22}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:320px}
thead th{padding:13px 14px;background:#0c110f;border-bottom:1px solid #8f774a;color:#d9bc7a;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;text-align:left}
thead th:last-child,tbody td:last-child{text-align:center}
tbody td{padding:14px;border-bottom:1px solid #ffffff10;font-size:13px;color:#e0e2d8}
tbody tr:nth-child(even){background:#ffffff04}
tbody tr:hover{background:#d9bc7a0c}
.rank{width:82px;color:#e8d29a;font:700 16px Cinzel,serif;font-weight:800;text-shadow:0 0 10px #d9bc7a55}
.student{font-weight:600}
.bridges{font-weight:700;color:#a3e8ae;font-variant-numeric:tabular-nums}
.foot{text-align:center;color:#7f8a7e;font-size:10px;letter-spacing:1px;margin:18px 0 0}
@media(max-width:540px){header{padding:16px;align-items:flex-start;flex-direction:column}.brand{font-size:16px}.back{align-self:flex-start}.board{padding:12px}.tab{padding:12px 8px;font-size:11px}thead th,tbody td{padding:12px 9px}}

.notice-overlay{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);
}
.notice-box{
  width:min(100%,420px);padding:28px 24px;text-align:center;
  background:linear-gradient(180deg,#171d19,#0b0f0d);border:1px solid var(--gold);
  box-shadow:0 20px 70px #000b;
}
.notice-box h2{margin:0 0 12px;color:var(--gold);font:600 23px Cinzel,serif}
.notice-box p{margin:0 0 22px;color:var(--text);font-size:14px;line-height:1.7}
.notice-box button{padding:11px 22px;border:1px solid var(--gold);background:#5b482b;color:#fff0c6;
  font-weight:700;letter-spacing:1px;cursor:pointer}

</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">THE THREE CROSSINGS<small>2D DARK FANTASY · TACTICAL MATH RPG</small></div>
  </header>
  <main>
    <div class="important-note" role="note">IMPORTANT: TODAY’S ENTRIES WILL BE UPDATED BY TOMORROW</div>
    <div class="eyebrow">The expedition records</div>
    <h1>Adventurer Rankings</h1>
    <p class="subtitle">Class rankings are ordered by score, from highest to lowest.</p>
    <section class="board" aria-label="Student rankings">
      <div class="tabs" role="tablist" aria-label="Choose class">
        <button class="tab" id="class7Tab" role="tab" aria-selected="true" aria-controls="rankingTable" data-class="7">CLASS 7</button>
        <button class="tab" id="class8Tab" role="tab" aria-selected="false" aria-controls="rankingTable" data-class="8">CLASS 8</button>
      </div>
      <div class="table-wrap">
        <table id="rankingTable">
          <thead><tr><th scope="col">Rank</th><th scope="col">Student</th><th scope="col">Score</th></tr></thead>
          <tbody id="rankingBody"></tbody>
        </table>
      </div>
      <p class="foot">RANKINGS · ORDERED BY SCORE</p>
    </section>
  </main>
</div>
<script>
// Edit the names and bridge counts for each class independently.
const classRankings = {
  "7": [
    { name: "Orienta", bridges: 3 },
    { name: "Thulungsat", bridges: 3 },
    { name: "Alauddin", bridges: 2 },
    { name: "Bhoomi", bridges: 2 },
    { name: "Diya", bridges: 2 },
    { name: "Nerson ", bridges: 2 },
    { name: "Ritishma", bridges: 2 },
    { name: "Simrita", bridges: 2 },
    { name: "Suyash", bridges: 2 },
    { name: "Swrangsarth", bridges: 2 },
    { name: "Thangkiraj", bridges: 2 },
    { name: "Uraj", bridges: 2 }
  ],
  "8": [
    { name: "Birfung", bridges: 3 },
    { name: "Jonaid", bridges: 3 },
    { name: "Pranab", bridges: 3 },
    { name: "Sanfung islary", bridges: 3 },
    { name: "Shem", bridges: 3 },
    { name: "Abhishek sangma", bridges: 1 }
  ]
};

const rankingBody = document.getElementById('rankingBody');
const tabs = [...document.querySelectorAll('.tab')];

function showClass(classNumber) {
  tabs.forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.class === classNumber)));
  const sorted = [...classRankings[classNumber]].sort((a, b) => b.bridges - a.bridges);
  if (sorted.length === 0) {
    rankingBody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#9ba29a;padding:24px">Class 8 rankings have not been added yet.</td></tr>';
    return;
  }
  let previousScore = null;
  let currentRank = 0;
  rankingBody.innerHTML = sorted.map((student) => {
    if (student.bridges !== previousScore) currentRank += 1;
    previousScore = student.bridges;
    return `
      <tr>
        <td class="rank"><strong>RANK ${currentRank}</strong></td>
        <td class="student">${student.name}</td>
        <td class="bridges">${student.bridges}/3</td>
      </tr>`;
  }).join('');
}
tabs.forEach(tab => tab.addEventListener('click', () => showClass(tab.dataset.class)));
showClass('7');
</script>
</body>
</html>
